name = "momo-blog"
main = "server/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 静态前端（Vite 构建产物）——由同一个 Worker 一并托管
[assets]
binding = "ASSETS"
directory = "./dist/client"
not_found_handling = "single-page-application"

# D1 数据库
# database_id 在 Cloudflare Dashboard 创建 D1 后填入（或运行 wrangler d1 create momo-blog-db 自动替换）
[[d1_databases]]
binding = "DB"
database_name = "momo-blog-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# R2 存储（媒体文件）
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "momo-blog-storage"

[observability]
enabled = true