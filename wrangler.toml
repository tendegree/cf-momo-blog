name = "momo-blog-cf"
main = "server/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 静态前端（Vite 构建产物）——由同一个 Worker 一并托管
# 注意：[assets] 是 wrangler 自动上传静态文件用的，不是 Runtime binding 声明，
# 不会触发 Cloudflare API 的绑定校验。部署成功后 Cloudflare 自动提供 ASSETS Fetcher 绑定。
[assets]
binding = "ASSETS"
directory = "./dist/client"
not_found_handling = "single-page-application"

# 重要：采用 Cloudflare“方式三 · Git 集成”部署时，绑定必须以 wrangler.toml 为准。
# 每次 push 都会执行 `npx wrangler deploy`，它会把本文件声明的绑定作为唯一真源，
# 因此 D1/R2 绑定必须写在这里（而不是仅靠 Dashboard 手动加，那会被 deploy 覆盖）。
# DB / STORAGE 是资源引用（非密钥），可安全提交。

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "momo-blog-db"
database_id = "9f3a5555-ffb1-4cb0-abeb-a634a22c08c7"

# R2 存储（媒体文件）
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "momo-blog-storage"

# Secrets（SECRET / SETUP_TOKEN / APP_URL）通过 Dashboard → Variables and Secrets 添加，
# wrangler deploy 不会删除 secrets，与上方资源绑定不冲突。

[observability]
enabled = true
