name = "momo-blog-cf"
main = "server/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 静态前端（Vite 构建产物）——由同一个 Worker 一并托管
# 注意：[assets] 是 wrangler 自动上传静态文件用的，不是 Runtime binding 声明，
# 不会触发 Cloudflare API 的绑定校验。部署成功后 Cloudflare 自动提供 ASSETS Fetcher 绑定。
[assets]
binding = "ASSETS"
directory = "./dist/client"
not_found_handling = "single-page-application"

# 以下 Runtime Bindings 在 Worker 首部署成功后，通过 Cloudflare Dashboard
# （Worker → Settings → Bindings）手动添加，避免占位符 ID 被 API 拒掉（code 10021）：
#   1. D1 Database  → 变量名 DB   → 指向 momo-blog-db
#   2. R2 Bucket    → 变量名 STORAGE → 指向 momo-blog-storage
# Secrets（Settings → Variables and Secrets）：
#   SECRET / SETUP_TOKEN / APP_URL

[observability]
enabled = true
